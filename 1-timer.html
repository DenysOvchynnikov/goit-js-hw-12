<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page 2</title>
    <script type="module" crossorigin src="/goit-js-hw-12/1-timer.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-js-hw-12/assets/styles-DAQgCTTH.js">
    <link rel="modulepreload" crossorigin href="/goit-js-hw-12/assets/vendor-BwJ01-pp.js">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/styles-DjVRS7hu.css">
    <link rel="stylesheet" crossorigin href="/goit-js-hw-12/assets/vendor-B-fgzGcT.css">
  </head>

  <body>
    <main>
      <div class="container">
        <div class="wrapper">
          <input type="text" id="datetime-picker" />
          <button type="button" data-start>Start</button>
        </div>
        <div class="timer">
          <div class="field">
            <span class="value" data-days>00</span>
            <span class="label">Days</span>
          </div>
          <div class="field">
            <span class="value" data-hours>00</span>
            <span class="label">Hours</span>
          </div>
          <div class="field">
            <span class="value" data-minutes>00</span>
            <span class="label">Minutes</span>
          </div>
          <div class="field">
            <span class="value" data-seconds>00</span>
            <span class="label">Seconds</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
